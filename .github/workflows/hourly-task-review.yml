# Close the tasks the studio's mail shows are finished, once an hour.
#
# Vercel's Hobby plan runs a cron at most once a day and rejects the whole
# deployment for anything more frequent (see docs/DEPLOY-VERCEL.md), so the
# hourly call comes from here instead.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL      https://janelle-interiors-automation.vercel.app
#   CRON_SECRET  the same value as CRON_SECRET in the Vercel project
#
# GitHub may start a scheduled run a few minutes late; that is fine here.
name: Hourly task review

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch: {}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the task review
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the APP_URL and CRON_SECRET repository secrets."
            exit 1
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/ops/cron/tasks")
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Task review answered HTTP $status"
            exit 1
          fi
