# nginx site for the self-hosted Janelle app (see deploy/README.md).
# Copy to /etc/nginx/sites-available/, symlink into sites-enabled, then run
# `sudo certbot --nginx -d dev-build.in` — certbot adds the 443 block.
# Change server_name and root if you use a subdomain or another path.
server {
    listen 80;
    server_name dev-build.in;

    root /var/www/janelle-automation/apps/web/dist;
    index index.html;

    # Uploads (drawings, PDFs) go through the API.
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://127.0.0.1:4055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # No 60s Vercel ceiling any more; give long jobs (backfills, media) room.
        proxy_read_timeout 300s;
    }

    # Hashed build assets can be cached for good; index.html never.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
